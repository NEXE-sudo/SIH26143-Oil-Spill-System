version: "3.9"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - CORS_ALLOW_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
      - DATABASE_URL=sqlite:////data/oilspill.db
    volumes:
      - backend-data:/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  backend-data:
